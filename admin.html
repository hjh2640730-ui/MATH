<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>관리자 페이지</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header class="admin-header">
    <div class="container">
      <div style="display:flex;align-items:center;gap:9px">
        <div style="width:28px;height:28px;background:rgba(255,255,255,0.2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.875rem">∑</div>
        <h1>관리자</h1>
      </div>
      <a href="index.html" class="header-link">← 학생 페이지</a>
    </div>
  </header>

  <main class="main">
    <div class="container">

      <!-- 로그인 -->
      <div id="login-section" class="login-card card">
        <div class="login-icon">🔐</div>
        <div class="login-title">관리자 로그인</div>
        <div class="login-sub">학원 관리자 전용 페이지입니다</div>
        <div class="form-group" style="text-align:left">
          <label>비밀번호</label>
          <input type="password" id="pw-input" class="input-field" placeholder="••••••••" autocomplete="current-password">
        </div>
        <p id="login-error" class="error-msg hidden" style="text-align:left">비밀번호가 틀렸습니다.</p>
        <button class="btn btn-primary btn-full" id="login-btn" style="margin-top:6px">로그인</button>
      </div>

      <!-- 관리 패널 -->
      <div id="admin-panel" class="hidden">

        <!-- 학생 선택 -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">학생 선택</span>
          </div>
          <div class="btn-group">
            <button class="btn btn-outline active" data-student="kimsiying">김시영 · 죽전고1</button>
            <button class="btn btn-outline" data-student="umtaehyun">엄태현 · 대지중1</button>
          </div>
        </div>

        <!-- 통계 -->
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-value" id="stat-pct">—</span>
            <span class="stat-label">진도율</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="stat-done">—</span>
            <span class="stat-label">완료 단원</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="stat-photos">—</span>
            <span class="stat-label">수업 사진일</span>
          </div>
        </div>

        <!-- 탭 -->
        <div class="tabs">
          <button class="tab active" data-tab="admin-progress">
            <span class="tab-icon">📚</span>진도 관리
          </button>
          <button class="tab" data-tab="admin-photos">
            <span class="tab-icon">📸</span>사진 업로드
          </button>
        </div>

        <!-- 진도 관리 탭 -->
        <div id="tab-admin-progress" class="tab-content">
          <div id="admin-progress-list"></div>
        </div>

        <!-- 사진 업로드 탭 -->
        <div id="tab-admin-photos" class="tab-content hidden">

          <div class="card">
            <div class="card-header">
              <span class="card-title">사진 업로드</span>
            </div>
            <div class="form-group">
              <label>날짜</label>
              <input type="date" id="upload-date" class="input-field">
            </div>
            <div class="upload-zone" id="upload-zone">
              <input type="file" id="photo-files" accept="image/*" multiple>
              <div class="upload-icon">🖼️</div>
              <div class="upload-text">사진을 끌어다 놓거나 클릭하세요</div>
              <div class="upload-sub">여러 장 선택 가능 · JPG, PNG, HEIC</div>
            </div>
            <div id="file-preview" style="margin-top:8px;font-size:0.8125rem;color:var(--text-muted)"></div>
            <button class="btn btn-primary btn-full" id="upload-btn" style="margin-top:12px">업로드</button>
            <div id="upload-progress" class="hidden" style="margin-top:12px">
              <div style="background:var(--border);border-radius:999px;height:4px;overflow:hidden">
                <div id="upload-bar" style="height:100%;background:var(--primary);width:0%;transition:width 0.3s;border-radius:999px"></div>
              </div>
              <p id="upload-status" style="font-size:0.8125rem;color:var(--text-secondary);margin-top:6px;text-align:center"></p>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <span class="card-title">사진 조회 / 삭제</span>
            </div>
            <div style="display:flex;gap:8px;align-items:flex-end">
              <div class="form-group" style="flex:1;margin-bottom:0">
                <label>날짜</label>
                <input type="date" id="view-date" class="input-field">
              </div>
              <button class="btn btn-secondary" id="view-btn" style="flex-shrink:0">조회</button>
            </div>
            <div id="admin-photo-gallery" class="admin-gallery"></div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
  <script src="data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
